<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opens · BLK HQ</title>
<link rel="icon" href="img/blk-disc.png">
<link rel="stylesheet" href="hq.css?v=2">
<link rel="stylesheet" href="../opens-v2.css?v=5">
<style>
.hq-body{background:#F4F3F0;color:#111214;min-height:60vh}
#page-opens{max-width:1520px;margin:0 auto;padding:30px 40px 90px}
@media (max-width:700px){#page-opens{padding:20px 14px 60px}}
#page-opens .o2-top p{margin:0 0 16px;color:#5E6266}
#page-opens .o2-month{background:#fff;border:1px solid #E3E1DC;border-radius:12px;overflow:hidden;padding:0 0 12px}
#page-opens .o2-month.drop{box-shadow:0 0 0 2px #111214;padding:0 0 12px}
#page-opens .o2-mh{background:#131313;color:#fff;padding:14px 20px;border:0;margin:0 0 12px;align-items:center}
#page-opens .o2-mh h2{font:900 22px/1 Archivo,sans-serif;letter-spacing:0;text-transform:uppercase}
#page-opens .o2-mh .meta{font:500 10px Montserrat,sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:#B9BDC3;margin-left:auto}
#page-opens .o2-mh .meta b{color:#fff}
#page-opens .o2-mh .meta .od{color:#F0A79F}
#page-opens .o2-mh .hint{color:#fff;margin-left:12px}
#page-opens .o2-scroll,#page-opens .o2-add{margin-left:12px;margin-right:12px;width:auto}
#page-opens .o2-add{display:block}
#page-opens .o2-types button.on{background:#131313}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<script src="hq.js?v=4"></script>
<script src="opens.js?v=2"></script>
</body>
